# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema of the MCP config options.
    {}
  commandFunction:
    # JS function that turns the config into the CLI command that starts the MCP on stdio.
    |-
    (config) => {
      // Try to detect if bun is available
      const isBunAvailable = (() => {
        try {
          require('child_process').execSync('bun --version', { stdio: 'ignore' });
          return true;
        } catch (e) {
          return false;
        }
      })();

      return {
        command: isBunAvailable ? 'bunx' : 'npx',
        args: ['claude-talk-to-figma-mcp@latest']
      };
    }
